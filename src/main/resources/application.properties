# ===================================================================
# PET HUB - Application Configuration
# ===================================================================
spring.application.name=pet-hub
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (Default MySQL with H2 Fallback/Dev Mode)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pet_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
# 86400000 ms = 24 Hours

# -------------------------------------------------------------------
# File Upload Configuration
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# -------------------------------------------------------------------
# Static Web Resources & MVC
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:./frontend/,file:./uploads/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
