<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — PET HUB</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="logo">
                <span class="logo-paw">🐾</span> PET HUB
            </a>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Shop</a></li>
            </ul>
            <div class="nav-icons">
                <a href="/cart.html" class="icon-btn" title="Shopping Cart">
                    🛒 <span id="cart-badge" class="badge">0</span>
                </a>
                <div id="nav-auth-section"></div>
            </div>
        </div>
    </header>

    <main class="container" style="margin: 40px auto; max-width: 980px;">
        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 32px; background: white; padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--border);">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800;">
                👤
            </div>
            <div>
                <h2 id="user-display-name" style="color: var(--secondary);">User Profile</h2>
                <span id="user-display-email" style="color: var(--dark-muted);"></span>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 32px;">
            <!-- Personal Info -->
            <div class="card" style="padding: 28px;">
                <h3 style="color: var(--secondary); margin-bottom: 20px;">Account Details</h3>
                <form id="profile-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group">
                            <label class="form-label">First Name</label>
                            <input type="text" id="profile-first-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Last Name</label>
                            <input type="text" id="profile-last-name" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email (Immutable)</label>
                        <input type="email" id="profile-email" class="form-control" disabled style="background: #f1f5f9;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="tel" id="profile-phone" class="form-control" pattern="^[0-9]{10}$">
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm btn-block" style="margin-top: 8px;">Save Changes</button>
                </form>

                <hr style="border: 0; border-top: 1px solid var(--border); margin: 28px 0;">

                <h3 style="color: var(--secondary); margin-bottom: 20px;">Change Password</h3>
                <form id="password-form">
                    <div class="form-group">
                        <label class="form-label">Current Password</label>
                        <input type="password" id="current-password" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" id="new-password" class="form-control" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" id="confirm-password" class="form-control" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-outline btn-sm btn-block" style="margin-top: 8px;">Update Password</button>
                </form>
            </div>

            <!-- Saved Addresses -->
            <div class="card" style="padding: 28px;">
                <h3 style="color: var(--secondary); margin-bottom: 20px;">Address Book</h3>
                <div id="profile-addresses-list">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <div>© 2026 PET HUB Inc. All rights reserved.</div>
            </div>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
