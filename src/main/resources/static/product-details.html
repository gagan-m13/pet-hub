<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details — PET HUB</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="logo">
                <span class="logo-paw">🐾</span> PET HUB
            </a>

            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link active">Shop Catalog</a></li>
            </ul>

            <div class="nav-icons">
                <a href="/cart.html" class="icon-btn" title="Shopping Cart">
                    🛒
                    <span id="cart-badge" class="badge">0</span>
                </a>
                <div id="nav-auth-section"></div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Breadcrumb / Back -->
        <div style="margin-top: 24px;">
            <a href="/products.html" style="color: var(--primary); font-weight: 600;">← Back to Catalog</a>
        </div>

        <!-- Product Details Main Block -->
        <div class="product-details-container">
            <!-- Gallery -->
            <div>
                <img id="main-gallery-img" class="gallery-main-img" src="" alt="Product Image">
                <div id="gallery-thumbs" class="gallery-thumbs"></div>
            </div>

            <!-- Info & Actions -->
            <div style="display: flex; flex-direction: column;">
                <div id="product-brand" style="font-size: 0.9rem; font-weight: 700; color: var(--accent); text-transform: uppercase;"></div>
                <h1 id="product-title" style="font-size: 2rem; font-weight: 800; color: var(--secondary); margin: 8px 0 12px; line-height: 1.3;"></h1>
                <div id="product-sku" style="font-size: 0.85rem; color: var(--dark-muted); margin-bottom: 16px;"></div>

                <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px;">
                    <span id="product-effective-price" style="font-size: 2rem; font-weight: 800; color: var(--dark);"></span>
                    <span id="product-old-price" style="font-size: 1.2rem; color: #94a3b8; text-decoration: line-through; display: none;"></span>
                    <span id="product-stock-badge" style="font-weight: 700; font-size: 0.9rem; margin-left: 8px;"></span>
                </div>

                <div style="border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 20px 0; margin-bottom: 24px;">
                    <h4 style="color: var(--secondary); margin-bottom: 8px;">About This Product</h4>
                    <p id="product-description" style="color: var(--dark-muted); line-height: 1.7; white-space: pre-line;"></p>
                </div>

                <div style="display: flex; align-items: center; gap: 16px; margin-top: auto;">
                    <div class="quantity-control">
                        <button id="qty-dec-btn" class="qty-btn">-</button>
                        <input id="product-qty-input" type="text" class="qty-input" value="1" readonly>
                        <button id="qty-inc-btn" class="qty-btn">+</button>
                    </div>

                    <button id="add-to-cart-btn" class="btn btn-primary" style="flex: 1; padding: 14px 28px; font-size: 1.05rem;">
                        Add to Cart 🛒
                    </button>
                </div>
            </div>
        </div>

        <!-- Customer Reviews & Rating Section -->
        <section style="background: white; border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 36px; margin: 40px 0;">
            <h2 style="font-size: 1.5rem; color: var(--secondary); margin-bottom: 20px;">Customer Reviews & Ratings</h2>

            <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px;">
                <!-- Review Submission Form -->
                <div style="background: #f8fafc; padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--border); height: fit-content;">
                    <h3 style="font-size: 1.15rem; margin-bottom: 14px;">Leave a Verified Review</h3>
                    <form id="review-form">
                        <div class="form-group">
                            <label class="form-label" for="review-rating">Your Rating</label>
                            <select id="review-rating" class="form-control" required>
                                <option value="5">★★★★★ (5 - Excellent)</option>
                                <option value="4">★★★★☆ (4 - Very Good)</option>
                                <option value="3">★★★☆☆ (3 - Good)</option>
                                <option value="2">★★☆☆☆ (2 - Fair)</option>
                                <option value="1">★☆☆☆☆ (1 - Poor)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="review-comment">Review Details</label>
                            <textarea id="review-comment" class="form-control" rows="4" placeholder="How did your pet like this product?" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-sm" style="margin-top: 8px;">Submit Review ⭐</button>
                    </form>
                </div>

                <!-- Reviews Feed -->
                <div>
                    <h3 style="font-size: 1.15rem; margin-bottom: 14px;">Recent Feedback</h3>
                    <div id="reviews-list">
                        <!-- Injected dynamically -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <div>© 2026 PET HUB Inc. All rights reserved.</div>
            </div>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/product-details.js"></script>
</body>
</html>
