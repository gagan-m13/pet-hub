<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management — PET HUB Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <span>🐾</span> PET HUB Admin
            </div>
            <ul class="admin-nav">
                <li class="admin-nav-item"><a href="/admin/dashboard.html">📊 Dashboard</a></li>
                <li class="admin-nav-item active"><a href="/admin/products.html">🛍️ Products</a></li>
                <li class="admin-nav-item"><a href="/admin/categories.html">📑 Categories</a></li>
                <li class="admin-nav-item"><a href="/admin/orders.html">📦 Orders</a></li>
                <li class="admin-nav-item"><a href="/admin/users.html">👥 Users</a></li>
                <li class="admin-nav-item"><a href="/admin/reviews.html">⭐ Reviews</a></li>
                <li class="admin-nav-item" style="margin-top: auto;"><a href="/index.html">🌐 View Store</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="admin-header">
                <div>
                    <h1 style="font-size: 1.8rem; color: var(--secondary);">Product Management</h1>
                    <p style="color: var(--dark-muted);">Create, update, upload images, adjust inventory and pricing</p>
                </div>
                <button onclick="openAddProductModal()" class="btn btn-primary btn-sm">+ Add New Product</button>
            </div>

            <!-- Product Table -->
            <div class="data-table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Img</th>
                            <th>Product Info</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-tbody">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="product-modal" class="modal-backdrop">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="product-modal-title" style="color: var(--secondary);">Add New Product</h2>
                <button onclick="closeProductModal()" class="icon-btn" style="font-size: 1.2rem;">✕</button>
            </div>

            <form id="product-form">
                <div class="form-group">
                    <label class="form-label" for="prod-name">Product Name *</label>
                    <input type="text" id="prod-name" class="form-control" required placeholder="e.g. Royal Canin Adult Maxi 4kg">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label class="form-label" for="prod-brand">Brand Name</label>
                        <input type="text" id="prod-brand" class="form-control" placeholder="e.g. Royal Canin">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="prod-sku">Unique SKU *</label>
                        <input type="text" id="prod-sku" class="form-control" required placeholder="e.g. RC-MAXI-4KG">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label class="form-label" for="prod-price">Regular Price (₹) *</label>
                        <input type="number" step="0.01" id="prod-price" class="form-control" required placeholder="2899.00">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="prod-discount-price">Sale Price (₹)</label>
                        <input type="number" step="0.01" id="prod-discount-price" class="form-control" placeholder="2599.00">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="prod-stock">Stock Qty *</label>
                        <input type="number" id="prod-stock" class="form-control" required value="25">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label class="form-label" for="prod-pet-category">Pet Type *</label>
                        <select id="prod-pet-category" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="prod-product-category">Category *</label>
                        <select id="prod-product-category" class="form-control" required></select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="prod-description">Full Description *</label>
                    <textarea id="prod-description" class="form-control" rows="4" required placeholder="Nutritional details, breed fit, specifications..."></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label class="form-label" for="prod-image-file">Upload Image File</label>
                        <input type="file" id="prod-image-file" class="form-control" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="prod-image-url">Or Image URL</label>
                        <input type="url" id="prod-image-url" class="form-control" placeholder="https://...">
                    </div>
                </div>

                <div style="display: flex; gap: 24px; margin: 16px 0;">
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer;">
                        <input type="checkbox" id="prod-active" checked> Active in Catalog
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer;">
                        <input type="checkbox" id="prod-featured"> Featured on Homepage
                    </label>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" onclick="closeProductModal()" class="btn btn-outline btn-sm">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/admin/products.js"></script>
</body>
</html>
