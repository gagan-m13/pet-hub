<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart — PET HUB</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cart.css">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="logo">
                <span class="logo-paw">🐾</span> PET HUB
            </a>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Shop</a></li>
            </ul>
            <div class="nav-icons">
                <a href="/cart.html" class="icon-btn" title="Shopping Cart">
                    🛒 <span id="cart-badge" class="badge">0</span>
                </a>
                <div id="nav-auth-section"></div>
            </div>
        </div>
    </header>

    <main class="container">
        <div style="margin: 32px 0 16px;">
            <h1 class="section-title">Your Shopping Cart 🛍️</h1>
        </div>

        <div id="cart-content-wrapper" class="cart-layout">
            <!-- Items Table -->
            <div class="cart-table-wrapper">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Unit Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cart-items-tbody">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>

            <!-- Order Summary Card -->
            <div class="cart-summary-card">
                <h3 style="color: var(--secondary); margin-bottom: 20px;">Order Summary</h3>

                <div class="summary-row">
                    <span>Cart Subtotal</span>
                    <span id="cart-subtotal" style="font-weight: 700;">₹0.00</span>
                </div>

                <div class="summary-row">
                    <span>Standard Shipping</span>
                    <span id="cart-shipping" style="font-weight: 700;">₹0.00</span>
                </div>

                <div class="summary-row">
                    <span>Estimated GST (5%)</span>
                    <span id="cart-tax" style="font-weight: 700;">₹0.00</span>
                </div>

                <div class="summary-total">
                    <span>Estimated Total</span>
                    <span id="cart-total">₹0.00</span>
                </div>

                <a id="checkout-btn" href="/checkout.html" class="btn btn-primary btn-block" style="padding: 14px 20px; font-size: 1.05rem;">
                    Proceed to Checkout 🐾
                </a>
                <div style="text-align: center; margin-top: 14px;">
                    <a href="/products.html" style="font-size: 0.9rem; color: var(--primary); font-weight: 600;">← Continue Shopping</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <div>© 2026 PET HUB Inc. All rights reserved.</div>
            </div>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
</body>
</html>
