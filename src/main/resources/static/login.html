<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — PET HUB</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="/index.html" class="logo">
                <span class="logo-paw">🐾</span> PET HUB
            </a>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Shop</a></li>
            </ul>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back! 🐾</h2>
                <p>Sign in to access your cart, track orders & exclusive perks</p>
            </div>

            <!-- Demo Credentials Helper Alert -->
            <div style="background: var(--primary-light); border: 1px solid rgba(255,107,53,0.3); border-radius: var(--radius-sm); padding: 12px; font-size: 0.85rem; margin-bottom: 20px; color: var(--dark);">
                <strong>Demo Credentials:</strong><br>
                • <strong>Customer:</strong> <code>customer@pethub.com</code> / <code>User@123</code><br>
                • <strong>Admin:</strong> <code>admin@pethub.com</code> / <code>Admin@123</code>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 12px;">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register.html">Create one now</a>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
